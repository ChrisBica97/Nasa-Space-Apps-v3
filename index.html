<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kinesoft: Asistente Médico de Tripulación</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky"><i></i><i></i></div>
  <div id="tip" class="mono"></div>
  <div id="toast"></div>

  <header class="g">
    <button class="ib hb" id="hb" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="drawer">☰</button>
    <h1>Kinesoft: Asistente Médico de Tripulación</h1>
    <label class="ctl xs">Entorno<select id="env"></select></label>
    <label class="ctl">Día <b id="dd" class="mono" style="color:var(--tx);min-width:58px"></b><input type="range" id="day" min="0" max="30" aria-label="Día de misión"></label>
    <button class="btn o sm" id="dys">Días</button>
    <button class="btn o sm" id="upl">Cargar archivo</button>
    <button class="btn" id="log">+ Registro diario</button>
  </header>

  <div id="scrim"></div>

  <aside id="drawer" class="g" inert aria-label="Menú de navegación">
    <div class="dh">
      <b class="mono">NAVEGACIÓN</b>
      <button class="ib" id="dx" aria-label="Cerrar menú">✕</button>
    </div>
    <div class="mono sec">TRIPULACIÓN</div>
    <div id="crew"></div>
    <div class="mono sec">SECCIONES</div>
    <nav id="nav" aria-label="Secciones de evaluación"></nav>
    <div class="mono sec">SIMULACIÓN</div>
    <label class="ctl" style="display:grid;margin-top:12px">Entorno de misión<select id="env2"></select></label>
    <p id="envnote" style="font-size:12px;color:var(--mu)"></p>
    <label class="ctl" style="display:grid;margin-top:8px">Cumplimiento de ejercicio <b id="adho" class="mono" style="color:var(--tx)"></b><input type="range" id="adh" min="0" max="100" step="5" style="width:100%"></label>
    <label class="ctl" style="display:grid;margin-top:12px">Dolor lumbar (0 a 10) <b id="vaso" class="mono" style="color:var(--tx)"></b><input type="range" id="vas" min="0" max="10" step="1" style="width:100%"></label>
  </aside>

  <div class="app">
    <main class="main" style="display:grid;gap:12px">
      <section class="g hero" id="hero"></section>
      <div class="rw">
        <button class="ib" data-r="tabs" data-d="-1" aria-label="Anterior">‹</button>
        <div class="rail" id="tabs"></div>
        <button class="ib" data-r="tabs" data-d="1" aria-label="Siguiente">›</button>
      </div>
      <div class="stage" id="stage"></div>
    </main>
  </div>

  <dialog id="dlg">
    <div id="dbody"></div>
  </dialog>

  <!-- Sistema de Alertas Dinámicas -->
  <div id="alert-toast-yellow" role="alert" aria-live="polite"></div>

  <div id="danger-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="danger-title">
    <div class="danger-card" id="danger-card-action">
      <div class="danger-symbol">[ ! ]</div>
      <h3 id="danger-title" style="margin: 0 0 8px; color: var(--bad);">ALERTA CRÍTICA DE MISIÓN</h3>
      <p id="danger-msg" style="margin: 0; font-size: 14px; color: var(--tx);">Se ha detectado un nivel de preocupación crítico en la zona afectada.</p>
      <small style="display: block; margin-top: 12px; color: var(--mu);">Haz clic aquí para inspeccionar y resolver</small>
      <button type="button" class="btn o sm" id="danger-close-btn" style="margin-top: 14px;">Descartar aviso</button>
    </div>
  </div>

  <script src="clinicalconfig.js"></script>
  <script src="anatomy.js"></script>
  <script src="importer.js"></script>
  <script src="apps.js"></script>
  <script src="nav.js"></script>
</body>
</html>
